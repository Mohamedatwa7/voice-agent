<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Agent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 70% -10%, #1e2a4a 0%, #0b0f1a 55%);
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8ecf4;
  }
  .card {
    width: min(680px, 94vw); background: rgba(20, 26, 42, 0.85); border: 1px solid #2a3555;
    border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: #8ea0c4; font-size: .9rem; margin-bottom: 20px; }
  textarea {
    width: 100%; min-height: 110px; resize: vertical; padding: 12px; font-size: 1rem;
    background: #0e1424; color: #e8ecf4; border: 1px solid #2a3555; border-radius: 10px;
  }
  textarea:focus { outline: none; border-color: #5b7cfa; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
  .tag {
    background: #182138; border: 1px solid #33406a; color: #aebcf0; border-radius: 999px;
    padding: 4px 12px; font-size: .8rem; cursor: pointer; transition: background .15s;
  }
  .tag:hover { background: #26325a; }
  label.small { display: block; color: #8ea0c4; font-size: .82rem; margin: 12px 0 4px; }
  input[type=range] { width: 100%; accent-color: #5b7cfa; }
  input[type=file] { font-size: .85rem; color: #8ea0c4; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  button.speak {
    width: 100%; margin-top: 18px; padding: 14px; font-size: 1.05rem; font-weight: 600;
    background: linear-gradient(135deg, #5b7cfa, #7b5bfa); color: white; border: none;
    border-radius: 12px; cursor: pointer; transition: filter .15s;
  }
  button.speak:hover:not(:disabled) { filter: brightness(1.15); }
  button.speak:disabled { filter: grayscale(.6); cursor: wait; }
  audio { width: 100%; margin-top: 16px; display: none; }
  .status { margin-top: 10px; font-size: .85rem; color: #8ea0c4; min-height: 1.2em; }
  .status.error { color: #ff7a7a; }
</style>
</head>
<body>
<div class="card">
  <h1>🎙️ Voice Agent</h1>
  <div class="sub">Chatterbox-Turbo TTS &middot; add expressions with the tags, optionally clone a voice from a short clip.</div>

  <textarea id="text" maxlength="10000">Hi there! [chuckle] I'm your voice agent. Type anything and I'll say it out loud.</textarea>

  <div class="tags" id="tags"></div>

  <div class="row">
    <div>
      <label class="small">Temperature: <span id="tval">0.8</span></label>
      <input type="range" id="temp" min="0.05" max="2" step="0.05" value="0.8">
    </div>
    <div>
      <label class="small">Reference voice (optional, 5&ndash;15s clip)</label>
      <input type="file" id="ref" accept="audio/*">
    </div>
  </div>

  <button class="speak" id="speak">🔊 Speak</button>
  <audio id="player" controls></audio>
  <div class="status" id="status"></div>
</div>

<script>
const TAGS = ["[chuckle]","[laugh]","[sigh]","[cough]","[clear throat]","[sniff]","[gasp]","[groan]","[shush]"];
const tagBox = document.getElementById("tags");
const text = document.getElementById("text");
for (const t of TAGS) {
  const b = document.createElement("button");
  b.className = "tag"; b.textContent = t;
  b.onclick = () => {
    const s = text.selectionStart, e = text.selectionEnd, v = text.value;
    const pre = (s === 0 || v[s-1] === " ") ? "" : " ";
    const suf = (e < v.length && v[e] === " ") ? "" : " ";
    text.value = v.slice(0, s) + pre + t + suf + v.slice(e);
    text.focus();
    text.selectionStart = text.selectionEnd = s + pre.length + t.length + suf.length;
  };
  tagBox.appendChild(b);
}

const temp = document.getElementById("temp");
temp.oninput = () => document.getElementById("tval").textContent = temp.value;

const speakBtn = document.getElementById("speak");
const status = document.getElementById("status");
const player = document.getElementById("player");

speakBtn.onclick = async () => {
  const t = text.value.trim();
  if (!t) { status.textContent = "Enter some text first."; return; }
  speakBtn.disabled = true;
  status.className = "status";
  status.textContent = t.length > 600
    ? "Generating… long texts are synthesized in chunks, this can take a while."
    : "Generating…";
  try {
    const fd = new FormData();
    fd.append("text", t);
    fd.append("temperature", temp.value);
    const ref = document.getElementById("ref").files[0];
    if (ref) fd.append("ref_audio", ref);
    const r = await fetch("/api/tts", { method: "POST", body: fd });
    if (!r.ok) {
      let msg = "Generation failed (" + r.status + ")";
      try { msg = (await r.json()).detail || (await r.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    const blob = await r.blob();
    player.src = URL.createObjectURL(blob);
    player.style.display = "block";
    await player.play().catch(() => {});
    status.textContent = "Done.";
  } catch (e) {
    status.className = "status error";
    status.textContent = e.message.includes("Failed to fetch") || e.message.includes("502")
      ? "Backend unreachable — is the PC running start-backend.ps1?"
      : e.message;
  } finally {
    speakBtn.disabled = false;
  }
};
</script>
</body>
</html>
